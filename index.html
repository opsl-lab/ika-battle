<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eefaff">

<title>IKA BATTLE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  background:#eaf8fd;
  color:#173f58;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:0 auto;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #f4fbfe 45%,
      #dff5fc 78%,
      #aee5f5 100%
    );

  padding-bottom:74px;
  overflow:hidden;
}


/* =========================
   HEADER
========================= */

.hero{
  position:relative;
  width:100%;
}

.hero img{
  display:block;
  width:100%;
  height:auto;
}


/* =========================
   MAIN
========================= */

main{
  padding:8px 15px 22px;
}


/* =========================
   CARD COMMON
========================= */

.card{
  position:relative;
  overflow:hidden;

  border-radius:20px;

  box-shadow:
    0 5px 15px
    rgba(42,109,143,.10);
}

.card-image{
  display:block;
  width:100%;
  height:auto;
}

/* =========================
   ANNUAL
========================= */

.annual-card{
  width:100%;
}

/* 年間王者 中央 */

.annual-winner{
  position:absolute;
  left:50%;
  top:24%;
  transform:translateX(-50%);
  width:28%;
  text-align:center;
  white-space:nowrap;
}

.annual-winner-name{
  display:block;
  color:#073c5d;
  font-size:clamp(12px, 3vw, 14px);
  font-weight:900;
  line-height:1;
  transform:translateY(3px);
}

.annual-winner-score{
  display:block;
  margin-top:10px;
  color:#0794d0;
  font-size:clamp(18px, 4.7vw, 22px);
  font-weight:900;
  line-height:.95;
}

/* 年間順位 */

.annual-ranking{
  position:absolute;
  left:5%;
  right:5%;
  bottom:13%;

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5%;
}

.annual-person{
  padding-left:0;
  text-align:center;
  white-space:nowrap;
}

.annual-person-name{
  display:block;
  color:#123f59;
  font-size:clamp(10px, 2.6vw, 12px);
  font-weight:900;
  line-height:1.05;
}

.annual-person-score{
  display:block;
  margin-top:4px;
  color:#078cc7;
  font-size:clamp(13px, 3.3vw, 16px);
  font-weight:900;
  line-height:1;
  transform:translateX(0);
}
 .annual-person:nth-child(1){
  transform:translateX(5px);
} 

  .annual-person:nth-child(3){
  transform:translateX(-5px);
}
/* =========================
   MVP + TAKO
========================= */

.mini-grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:8px;
  margin-top:8px;
  align-items:start;
}

.mini-card{
  width:100%;
  border-radius:18px;
}


/* =========================
   MVP
========================= */

.mvp-data{
  position:absolute;
  left:33%;
  top:44%;
  transform:translateX(-50%);
  text-align:center;
  white-space:nowrap;
}

.mvp-name{
  display:block;
  color:#073e60;
  font-size:clamp(11px, 2.8vw, 13px);
  font-weight:900;
  line-height:1;
  transform:translateX(5px);
}

.mvp-score{
  display:block;
  margin-top:7px;
  color:#098ec8;
  font-size:clamp(17px, 4.4vw, 21px);
  font-weight:900;
  line-height:1;
  transform:translateX(0);
}


/* =========================
   TAKO
========================= */

.tako-ranking{
  position:absolute;
  left:4%;
  right:4%;
  bottom:12%;

  display:grid;
  grid-template-columns:repeat(3,1fr);
}

.tako-person{
  padding-left:0;
  text-align:center;
  white-space:nowrap;
}

.tako-name{
  display:block;
  color:#173f58;
  font-size:clamp(9px, 2.3vw, 11px);
  font-weight:900;
  line-height:1;
  transform:translateY(-2px);
}

.tako-score{
  display:block;
  margin-top:3px;
  color:#d9555b;
  font-size:clamp(13px, 3.2vw, 15px);
  font-weight:900;
  line-height:1;
  transform:translateX(0);
}


/* =========================
   RECENT
========================= */

.recent{
  margin-top:10px;

  padding:13px 14px 10px;

  background:
    rgba(255,255,255,.95);

  border-radius:20px;

  box-shadow:
    0 5px 15px
    rgba(45,109,140,.09);
}

.recent-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  padding-bottom:8px;

  border-bottom:
    1px solid #e3eef3;
}

.recent-title-wrap{
  display:flex;

  align-items:center;

  gap:8px;
}

.recent-title-icon{
  display:grid;

  place-items:center;

  width:29px;
  height:29px;

  border-radius:50%;

  background:#e5f6fc;
}

.recent-title-icon img{
  width:22px;
  height:22px;

  object-fit:contain;
}

.recent-title{
  color:#247ca8;

  font-size:13px;
  font-weight:900;

  letter-spacing:.13em;
}

.recent-title-jp{
  margin-top:1px;

  color:#3084aa;

  font-size:9px;
  font-weight:700;
}

.view-all{
  border:none;

  padding:7px 12px;

  border-radius:999px;

  background:#e9f7fc;

  color:#36728f;

  font-size:9px;
  font-weight:800;

  cursor:pointer;
}


/* 釣果 */

.catch-row{
  display:grid;

  grid-template-columns:
    48px
    70px
    35px
    1fr
    auto;

  align-items:center;

  min-height:47px;

  column-gap:5px;

  border-bottom:
    1px solid #e8eff2;
}

.catch-row:last-child{
  border-bottom:none;
}

.catch-date{
  color:#36586b;
  font-size:11px;
}

.catch-name{
  color:#173f58;

  font-size:12px;
  font-weight:800;
}

.catch-icon{
  width:29px;
  height:29px;

  object-fit:contain;

  justify-self:center;
}

.catch-type{
  color:#294f64;
  font-size:11px;
}

.catch-score{
  color:#1486c6;

  font-size:17px;
  font-weight:900;

  white-space:nowrap;
}

.catch-score small{
  font-size:9px;
}


/* =========================
   REGISTER AREA
========================= */

.register-area{
  position:relative;

  margin-top:12px;

  min-height:90px;

  display:flex;

  align-items:flex-start;
  justify-content:center;

  padding-top:18px;
  padding-bottom:20px;
}

.register-note{
  position:absolute;

  left:0;
  bottom:17px;

  color:
    rgba(255,255,255,.98);

  font-size:10px;

  line-height:1.55;

  transform:rotate(-5deg);

  text-shadow:
    0 1px 4px
    rgba(29,111,150,.30);
}

.register-button{
  position:relative;

  z-index:2;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:10px;

  width:68%;

  min-height:53px;

  border:
    2px solid
    rgba(255,255,255,.9);

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #19c0e4,
      #047ac7
    );

  color:#fff;

  font-size:15px;
  font-weight:900;

  box-shadow:
    0 6px 15px
    rgba(12,121,180,.25);

  cursor:pointer;
}

.register-plus{
  display:grid;

  place-items:center;

  width:29px;
  height:29px;

  border-radius:50%;

  background:#fff;

  color:#148bc9;

  font-size:25px;
  font-weight:500;

  line-height:1;
}

.register-arrow{
  position:absolute;

  right:14px;

  font-size:25px;
  font-weight:300;
}


/* =========================
   FISH
========================= */

.fish-decoration{
  position:absolute;

  right:0;
  bottom:12px;

  width:62px;
  height:50px;

  opacity:.38;
}

.fish{
  position:absolute;

  width:24px;
  height:9px;

  border-radius:
    70% 35% 35% 70%;

  background:#147eb0;

  transform:rotate(-24deg);
}

.fish::after{
  content:"";

  position:absolute;

  right:-7px;
  top:1px;

  width:0;
  height:0;

  border-top:
    4px solid transparent;

  border-bottom:
    4px solid transparent;

  border-left:
    8px solid #147eb0;
}

.fish.one{
  right:5px;
  top:3px;

  transform:
    rotate(-27deg)
    scale(1.15);
}

.fish.two{
  right:30px;
  top:25px;

  transform:
    rotate(-22deg)
    scale(.78);
}

.fish.three{
  right:5px;
  top:36px;

  transform:
    rotate(-18deg)
    scale(.65);
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;

  left:50%;
  bottom:0;

  transform:
    translateX(-50%);

  z-index:100;

  width:100%;
  max-width:430px;

  height:74px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  background:
    rgba(255,255,255,.98);

  border-top:
    1px solid #e1edf2;

  box-shadow:
    0 -4px 14px
    rgba(47,97,121,.06);
}

.nav-item{
  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  border:none;

  background:transparent;

  color:#7895a5;

  font-size:9px;
  font-weight:800;

  cursor:pointer;
}

.nav-item.active{
  color:#0ca5e0;
}

.nav-icon{
  position:relative;

  width:24px;
  height:24px;
}


/* HOME */

.home-icon::before{
  content:"";

  position:absolute;

  left:5px;
  top:9px;

  width:14px;
  height:12px;

  border:
    2px solid currentColor;

  border-top:none;

  border-radius:2px;
}

.home-icon::after{
  content:"";

  position:absolute;

  left:5px;
  top:4px;

  width:13px;
  height:13px;

  border-left:
    2px solid currentColor;

  border-top:
    2px solid currentColor;

  transform:
    rotate(45deg);
}


/* PLUS */

.plus-icon{
  border:
    2px solid currentColor;

  border-radius:50%;
}

.plus-icon::before,
.plus-icon::after{
  content:"";

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:currentColor;
}

.plus-icon::before{
  width:10px;
  height:2px;
}

.plus-icon::after{
  width:2px;
  height:10px;
}


/* HISTORY */

.history-icon::before{
  content:"";

  position:absolute;

  left:3px;
  top:4px;

  width:4px;
  height:4px;

  border-radius:50%;

  background:currentColor;

  box-shadow:
    0 7px 0 currentColor,
    0 14px 0 currentColor;
}

.history-icon::after{
  content:"";

  position:absolute;

  left:10px;
  top:5px;

  width:12px;
  height:2px;

  background:currentColor;

  box-shadow:
    0 7px 0 currentColor,
    0 14px 0 currentColor;
}


/* DATA */

.data-icon{
  border-bottom:
    2px solid currentColor;
}

.data-icon::before{
  content:"";

  position:absolute;

  left:4px;
  bottom:2px;

  width:4px;
  height:9px;

  background:currentColor;

  box-shadow:
    7px -6px 0 currentColor,
    14px -12px 0 currentColor;
}


/* =========================
   PC
========================= */

@media(min-width:431px){

  body{
    padding:10px 0;
  }

  .app{
    min-height:
      calc(100vh - 20px);
  }

  .bottom-nav{
    bottom:10px;
  }
}


/* 釣果登録画面：ホームの既存スタイルには変更を加えない */
#catch-registration[hidden]{display:none;}
#catch-registration{padding:16px 20px 18px;}
#catch-registration .entry-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-bottom:8px;padding:8px 14px;border:1px solid #cde8f3;border-radius:999px;background:#eefaff;color:#247ca8;font-size:13px;font-weight:800;cursor:pointer;}
#catch-registration .entry-kicker{color:#2486ac;font-size:11px;font-weight:800;letter-spacing:.16em;}
#catch-registration h1{margin:4px 0 4px;font-size:24px;color:#173f58;}
#catch-registration .entry-intro{font-size:13px;line-height:1.7;color:#527d92;margin-bottom:14px;}
#catch-registration .entry-card{background:rgba(255,255,255,.96);border:1px solid #e0f1f7;border-radius:22px;padding:16px 18px;box-shadow:0 5px 15px rgba(42,109,143,.10);}
#catch-registration .entry-field{margin-bottom:16px;min-width:0;border:0;padding:0;}
#catch-registration .entry-label{display:block;font-size:14px;font-weight:800;margin-bottom:7px;}
#catch-registration input[type=date]{display:block;width:100%;min-width:0;min-height:46px;border:1px solid #b8dfeF;border-radius:12px;padding:10px 12px;color:#173f58;background:#f5fcff;font:inherit;}
#catch-registration .entry-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;}
#catch-registration .entry-choice{position:relative;cursor:pointer;}
#catch-registration .entry-choice input{position:absolute;opacity:0;width:1px;height:1px;}
#catch-registration .entry-choice span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #d3eaf3;border-radius:12px;background:#f5fbfe;font-size:12px;font-weight:800;white-space:nowrap;}
#catch-registration .entry-choice input:checked + span{color:#087db6;background:#e2f6ff;border:2px solid #18a6d6;}
#catch-registration .entry-choice input:focus-visible + span{outline:3px solid #173f58;outline-offset:3px;}
#catch-registration .entry-counter{display:flex;align-items:center;justify-content:center;gap:22px;}
#catch-registration .entry-counter button{width:44px;height:44px;border:1px solid #b7e2f1;border-radius:50%;background:#eaf8fe;color:#078bc6;font-size:27px;cursor:pointer;}
#catch-registration .entry-counter button:disabled{opacity:.4;cursor:default;}
#catch-registration .entry-amount{min-width:65px;text-align:center;color:#078bc6;font-size:28px;font-weight:900;}
#catch-registration .entry-unit{font-size:14px;margin-left:4px;}
#catch-registration .entry-submit{width:100%;min-height:54px;border:2px solid white;border-radius:999px;background:linear-gradient(135deg,#19c0e4,#047ac7);color:white;font-size:18px;font-weight:900;box-shadow:0 6px 15px rgba(12,121,180,.25);cursor:pointer;}
#catch-registration .entry-feedback{min-height:22px;margin-top:8px;text-align:center;color:#087aa3;font-size:15px;font-weight:800;}
#catch-registration .entry-preview-note{text-align:center;font-size:11px;color:#527d92;line-height:1.7;margin-top:8px;}


#catch-registration .entry-submit:disabled{opacity:.65;cursor:default;}
#catch-registration .entry-next{display:block;margin:8px auto 0;min-height:44px;padding:8px 16px;border:1px solid #b7e2f1;border-radius:999px;background:#eaf8fe;color:#078bc6;font-size:13px;font-weight:800;cursor:pointer;}
#catch-registration .entry-next[hidden]{display:none;}
#catch-history[hidden]{display:none;}
#catch-history{padding:16px 20px 18px;}
#catch-history .history-back{display:inline-flex;align-items:center;min-height:44px;margin-bottom:8px;padding:8px 14px;border:1px solid #cde8f3;border-radius:999px;background:#eefaff;color:#247ca8;font-size:13px;font-weight:800;cursor:pointer;}
#catch-history .history-kicker{color:#2486ac;font-size:11px;font-weight:800;letter-spacing:.16em;}
#catch-history h1{margin:4px 0 10px;font-size:24px;}
#catch-history .history-status{font-size:12px;line-height:1.7;color:#527d92;margin-bottom:14px;}
#catch-history .history-list{list-style:none;padding:0;margin:0;display:grid;gap:10px;}
#catch-history .history-record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:rgba(255,255,255,.96);border:1px solid #e0f1f7;border-radius:18px;box-shadow:0 5px 15px rgba(42,109,143,.08);}
#catch-history time{font-size:11px;color:#527d92;}
#catch-history .history-person{font-size:16px;font-weight:800;margin:6px 0 4px;}
#catch-history .history-species{font-size:12px;color:#527d92;}
#catch-history .history-amount{font-size:24px;font-weight:900;color:#078bc6;overflow-wrap:anywhere;min-width:0;}
#catch-history .history-register{width:100%;min-height:48px;border:1px solid #b7e2f1;border-radius:999px;background:#eaf8fe;color:#078bc6;font-size:14px;font-weight:800;margin-top:16px;cursor:pointer;}
#catch-history .history-note{font-size:11px;line-height:1.7;color:#527d92;margin-top:12px;}

</style>
</head>


<body>

<div class="app">


  <!-- HEADER -->

  <header class="hero">

    <img
      src="images/header.png"
      alt="IKA BATTLE"
    >

  </header>


  <main>


    <!-- =====================
         年間王者
    ====================== -->

    <section
      class="card annual-card">

      <img
        class="card-image"
        src="images/card-annual.png?v=2"
        alt="年間王者"
      >


      <div class="annual-winner">

        <span
          class="annual-winner-name"
          id="annualWinnerName">
        </span>

        <span
          class="annual-winner-score"
          id="annualWinnerScore">
        </span>

      </div>


      <div
        class="annual-ranking"
        id="annualRanking">
      </div>

    </section>



    <!-- =====================
         MVP + タコ
    ====================== -->

    <div class="mini-grid">


      <!-- MVP -->

      <section
        class="card mini-card">

        <img
          class="card-image"
          src="images/card-monthly.png"
          alt="今月のMVP"
        >

        <div class="mvp-data">

          <span
            class="mvp-name"
            id="mvpName">
          </span>

          <span
            class="mvp-score"
            id="mvpScore">
          </span>

        </div>

      </section>



      <!-- タコ -->

      <section
        class="card mini-card">

        <img
          class="card-image"
          src="images/card-tako.png?v=2"
          alt="タコ部門"
        >

        <div
          class="tako-ranking"
          id="takoRanking">
        </div>

      </section>


    </div>



    <!-- =====================
         RECENT CATCHES
    ====================== -->

    <section class="recent">


      <div class="recent-header">


        <div class="recent-title-wrap">


          <div class="recent-title-icon">

            <img
              src="images/aori-icon.png"
              alt=""
            >

          </div>


          <div>

            <div class="recent-title">
              RECENT CATCHES
            </div>

            <div class="recent-title-jp">
              最近の釣果
            </div>

          </div>


        </div>


        <button
          class="view-all"
          type="button">

          すべて見る 〉

        </button>


      </div>



      <!-- 1 -->

      <div class="catch-row">

        <div class="catch-date">
          9/21
        </div>

        <div class="catch-name">
          ひろき
        </div>

        <img
          class="catch-icon"
          src="images/aori-icon.png"
          alt=""
        >

        <div class="catch-type">
          アオリイカ
        </div>

        <div class="catch-score">
          5<small>杯</small>
        </div>

      </div>



      <!-- 2 -->

      <div class="catch-row">

        <div class="catch-date">
          9/20
        </div>

        <div class="catch-name">
          まさき
        </div>

        <img
          class="catch-icon"
          src="images/kouika-icon.png"
          alt=""
        >

        <div class="catch-type">
          コウイカ
        </div>

        <div class="catch-score">
          3<small>杯</small>
        </div>

      </div>



      <!-- 3 -->

      <div class="catch-row">

        <div class="catch-date">
          9/18
        </div>

        <div class="catch-name">
          ゆうま
        </div>

        <img
          class="catch-icon"
          src="images/aori-icon.png"
          alt=""
        >

        <div class="catch-type">
          アオリイカ
        </div>

        <div class="catch-score">
          4<small>杯</small>
        </div>

      </div>


    </section>



    <!-- =====================
         登録ボタン
    ====================== -->

    <section class="register-area">


      <div class="register-note">

        釣ったイカが<br>
        思い出になる。

      </div>


      <button
        class="register-button"
        type="button">

        <span class="register-plus">
          ＋
        </span>

        <span>
          釣果を登録する
        </span>

        <span class="register-arrow">
          〉
        </span>

      </button>


      <div class="fish-decoration">

        <span class="fish one"></span>
        <span class="fish two"></span>
        <span class="fish three"></span>

      </div>


    </section>


  </main>

  <section id="catch-registration" aria-labelledby="entry-title" hidden>
    <button id="entry-back" class="entry-back" type="button" aria-label="ホームに戻る"><span aria-hidden="true">←</span> 戻る</button>
    <p class="entry-kicker">IKA BATTLE / CATCH</p>
    <h1 id="entry-title" tabindex="-1">釣果登録</h1>
    <p class="entry-intro">今日の釣果を、ひとつずつ。</p>
    <form id="catch-form" class="entry-card">
      <div class="entry-field">
        <label class="entry-label" for="catch-date">日付</label>
        <input id="catch-date" name="date" type="date" required>
      </div>
      <fieldset class="entry-field">
        <legend class="entry-label">釣った人</legend>
        <div class="entry-options">
          <label class="entry-choice"><input type="radio" name="angler" value="ひろき" checked required><span>ひろき</span></label>
          <label class="entry-choice"><input type="radio" name="angler" value="ゆうま"  required><span>ゆうま</span></label>
          <label class="entry-choice"><input type="radio" name="angler" value="まさき"  required><span>まさき</span></label>
        </div>
      </fieldset>
      <fieldset class="entry-field">
        <legend class="entry-label">種類</legend>
        <div class="entry-options">
          <label class="entry-choice"><input type="radio" name="species" value="アオリイカ" checked required><span>アオリイカ</span></label>
          <label class="entry-choice"><input type="radio" name="species" value="コウイカ"  required><span>コウイカ</span></label>
          <label class="entry-choice"><input type="radio" name="species" value="タコ"  required><span>タコ</span></label>
        </div>
      </fieldset>
      <div class="entry-field">
        <span class="entry-label" id="count-label">数</span>
        <div class="entry-counter" role="group" aria-labelledby="count-label">
          <button id="count-minus" type="button" aria-label="数を減らす" disabled>－</button>
          <output class="entry-amount" aria-live="polite"><span id="catch-count">1</span><span id="catch-unit" class="entry-unit">杯</span></output>
          <button id="count-plus" type="button" aria-label="数を増やす">＋</button>
        </div>
      </div>
      <button class="entry-submit" type="submit">登録する</button>
      <p id="entry-feedback" class="entry-feedback" role="status" aria-live="polite"></p>
      <button id="entry-next" class="entry-next" type="button" hidden>続けて登録する</button>
    </form>
    <p class="entry-preview-note">このブラウザに保存されます。3人での共有はまだできません。</p>
  </section>

  <section id="catch-history" aria-labelledby="history-title" hidden>
    <button id="history-back" class="history-back" type="button" aria-label="ホームに戻る">← 戻る</button>
    <p class="history-kicker">IKA BATTLE / HISTORY</p>
    <h1 id="history-title" tabindex="-1">釣果履歴</h1>
    <p id="history-status" class="history-status" role="status"></p>
    <ul id="history-list" class="history-list" aria-label="登録した釣果"></ul>
    <button id="history-register" class="history-register" type="button">＋ 釣果を登録する</button>
    <p class="history-note">このブラウザで登録した釣果を表示しています。ブラウザのデータを消すと記録も消えます。ホームのランキング・最近の釣果は、まだサンプル表示です。</p>
  </section>




</div>



<!-- =====================
     BOTTOM NAV
===================== -->

<nav class="bottom-nav">


  <button
    class="nav-item active"
    type="button">

    <span
      class="nav-icon home-icon">
    </span>

    <span>
      ホーム
    </span>

  </button>



  <button
    class="nav-item"
    type="button">

    <span
      class="nav-icon plus-icon">
    </span>

    <span>
      釣果登録
    </span>

  </button>



  <button
    class="nav-item"
    type="button">

    <span
      class="nav-icon history-icon">
    </span>

    <span>
      履歴
    </span>

  </button>



  <button
    class="nav-item"
    type="button">

    <span
      class="nav-icon data-icon">
    </span>

    <span>
      データ
    </span>

  </button>


</nav>



<script>

/*
=================================
  仮データ
  ↓
  あとで登録データへ接続する
=================================
*/

const battleData = {

  annual: [

    {
      name:"ひろき",
      score:42
    },

    {
      name:"ゆうま",
      score:37
    },

    {
      name:"まさき",
      score:31
    }

  ],


  monthlyMvp:{

    name:"まさき",
    score:18

  },


  tako:[

    {
      name:"ひろき",
      score:2
    },

    {
      name:"ゆうま",
      score:0
    },

    {
      name:"まさき",
      score:1
    }

  ]

};



/* =====================
   年間王者
===================== */

const annual =
  [...battleData.annual]
  .sort(
    (a,b) =>
    b.score - a.score
  );


const winner =
  annual[0];


document
  .getElementById(
    "annualWinnerName"
  )
  .textContent =
  winner.name;


document
  .getElementById(
    "annualWinnerScore"
  )
  .textContent =
  winner.score + "杯";



/* 年間順位 */

const annualRanking =
  document.getElementById(
    "annualRanking"
  );


annual.forEach(
  person => {

    annualRanking
      .insertAdjacentHTML(

        "beforeend",

        `
        <div class="annual-person">

          <span
            class="annual-person-name">

            ${person.name}

          </span>

          <span
            class="annual-person-score">

            ${person.score}杯

        </span>

        </div>
        `

      );

  }
);



/* =====================
   MONTHLY MVP
===================== */

document
  .getElementById(
    "mvpName"
  )
  .textContent =
  battleData
    .monthlyMvp
    .name;


document
  .getElementById(
    "mvpScore"
  )
  .textContent =
  battleData
    .monthlyMvp
    .score;



/* =====================
   タコ
===================== */

const takoRanking =
  document.getElementById(
    "takoRanking"
  );


battleData
  .tako
  .forEach(

    person => {

      takoRanking
        .insertAdjacentHTML(

          "beforeend",

          `
          <div class="tako-person">

            <span
              class="tako-name">

              ${person.name}

            </span>

            <span
              class="tako-score">

              ${person.score}匹

            </span>
          </div>
          `

        );

    }

  );


/* 端末内の保存と履歴。ホームの仮データは別管理。 */
(() => {
  const key = 'ika-battle.catches.v1';
  const homeHeader = document.querySelector('.hero');
  const homeMain = document.querySelector('main');
  const registration = document.getElementById('catch-registration');
  const history = document.getElementById('catch-history');
  const nav = document.querySelectorAll('.nav-item');
  const form = document.getElementById('catch-form');
  const date = document.getElementById('catch-date');
  const feedback = document.getElementById('entry-feedback');
  const submit = form.querySelector('.entry-submit');
  const minus = document.getElementById('count-minus');
  const nextEntry = document.getElementById('entry-next');
  const list = document.getElementById('history-list');
  const status = document.getElementById('history-status');
  let count = 1;
  let homeScroll = 0;
  let current = 0;
  let submitted = false;
  const today = new Date();
  date.value = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  function validRecord(record) {
    return record && typeof record.id === 'string' &&
      typeof record.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(record.date) &&
      Number.isFinite(Date.parse(record.date)) &&
      new Date(record.date).toISOString().slice(0,10) === record.date &&
      ['ひろき','ゆうま','まさき'].includes(record.angler) &&
      ['アオリイカ','コウイカ','タコ'].includes(record.species) &&
      Number.isSafeInteger(record.count) && record.count >= 1;
  }
  function readRecords() {
    const raw = localStorage.getItem(key);
    const records = raw === null ? [] : JSON.parse(raw);
    if (!Array.isArray(records) || !records.every(validRecord)) throw new Error('Invalid records');
    return records;
  }
  function renderHistory() {
    list.replaceChildren();
    try {
      const records = readRecords().slice().reverse().sort((a,b)=>b.date.localeCompare(a.date));
      status.textContent = records.length ? records.length + '件の記録 · 新しい日付順' : 'まだ釣果の記録がありません。釣果登録から最初の1件を登録しましょう。';
      for (const record of records) {
        const item = document.createElement('li');
        item.className = 'history-record';
        const details = document.createElement('div');
        const day = document.createElement('time');
        day.dateTime = record.date;
        day.textContent = record.date.replaceAll('-','/');
        const name = document.createElement('p');
        name.className = 'history-person';
        name.textContent = record.angler;
        const species = document.createElement('p');
        species.className = 'history-species';
        species.textContent = record.species;
        details.append(day,name,species);
        const amount = document.createElement('p');
        amount.className = 'history-amount';
        amount.textContent = record.count + (record.species === 'タコ' ? '匹' : '杯');
        item.append(details,amount);
        list.append(item);
      }
    } catch {
      status.textContent = '記録を読み込めませんでした。ブラウザの保存設定を確認してください。保存済みの内容は変更していません。';
    }
  }
  nav[0].setAttribute('aria-current','page');
  function showPage(next) {
    if (current === 0 && next !== 0) homeScroll = window.scrollY;
    homeHeader.hidden = next !== 0;
    homeMain.hidden = next !== 0;
    registration.hidden = next !== 1;
    history.hidden = next !== 2;
    nav.forEach((button,index)=>{
      button.classList.toggle('active',index === next);
      if (index === next) button.setAttribute('aria-current','page');
      else button.removeAttribute('aria-current');
    });
    current = next;
    if (next === 2) renderHistory();
    window.scrollTo(0,next === 0 ? homeScroll : 0);
    if (next !== 0) document.getElementById(next === 1 ? 'entry-title' : 'history-title').focus({preventScroll:true});
  }
  document.querySelector('.register-button').addEventListener('click',()=>showPage(1));
  document.querySelector('.view-all').addEventListener('click',()=>showPage(2));
  nav[0].addEventListener('click',()=>showPage(0));
  nav[1].addEventListener('click',()=>showPage(1));
  nav[2].addEventListener('click',()=>showPage(2));
  document.getElementById('entry-back').addEventListener('click',()=>{
    showPage(0);
    document.querySelector('.register-button').focus({preventScroll:true});
  });
  document.getElementById('history-back').addEventListener('click',()=>{
    showPage(0);
    nav[0].focus({preventScroll:true});
  });
  document.getElementById('history-register').addEventListener('click',()=>showPage(1));
  function clearFeedback() {
    nextEntry.hidden = true;
    submitted = false;
    submit.disabled = false;
    feedback.textContent = '';
  }
  function updateCount(delta) {
    count = Math.min(Number.MAX_SAFE_INTEGER,Math.max(1,count + delta));
    document.getElementById('catch-count').textContent = count;
    minus.disabled = count === 1;
    clearFeedback();
  }
  minus.addEventListener('click',()=>updateCount(-1));
  nextEntry.addEventListener('click',()=>{
    count = 1;
    updateCount(0);
    date.focus();
  });
  document.getElementById('count-plus').addEventListener('click',()=>updateCount(1));
  form.addEventListener('input',clearFeedback);
  form.addEventListener('change',()=>{
    clearFeedback();
    document.getElementById('catch-unit').textContent = form.elements.species.value === 'タコ' ? '匹' : '杯';
  });
  form.addEventListener('submit',event=>{
    event.preventDefault();
    if (submitted || !form.reportValidity()) return;
    const record = {
      id: typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
      date:date.value, angler:form.elements.angler.value,
      species:form.elements.species.value, count
    };
    if (!validRecord(record)) {
      feedback.textContent = '日付と入力内容を確認してください。';
      return;
    }
    try {
      const records = readRecords();
      records.push(record);
      localStorage.setItem(key,JSON.stringify(records));
      submitted = true;
      submit.disabled = true;
      feedback.textContent = '登録しました！';
      nextEntry.hidden = false;
    } catch {
      feedback.textContent = '保存できませんでした。ブラウザの保存設定や空き容量を確認して、もう一度お試しください。';
    }
  });
  window.addEventListener('storage',event=>{
    if ((event.key === key || event.key === null) && current === 2) renderHistory();
  });
})();


</script>


</body>
</html>
