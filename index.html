<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fcff">

  <title>IKA BATTLE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      background: #eef8fc;
      color: #24445b;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f8fcff 55%,
          #eef9fd 100%
        );
      padding-bottom: 94px;
      box-shadow: 0 0 30px rgba(54, 121, 154, 0.10);
    }

    /* =========================
       HEADER
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #75c8e8;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }

    .season {
      position: absolute;
      left: 50%;
      bottom: 9px;
      transform: translateX(-50%);
      padding: 5px 15px;

      border: 1px solid rgba(255,255,255,.75);
      border-radius: 999px;

      background: rgba(32, 115, 157, .42);
      backdrop-filter: blur(5px);

      color: white;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      white-space: nowrap;

      text-shadow: 0 1px 3px rgba(0,0,0,.18);
    }

    /* =========================
       CONTENT
    ========================= */

    main {
      padding: 14px 13px 22px;
    }

    .section-space {
      margin-top: 13px;
    }

    /* =========================
       IMAGE CARDS
    ========================= */

    .image-card {
      position: relative;
      overflow: hidden;
      width: 100%;

      border-radius: 22px;
      box-shadow:
        0 6px 18px rgba(54, 107, 137, .10);
    }

    .image-card > img {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      年間王者
      背景画像の空欄部分へHTML文字を重ねる
    */

    .annual-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .annual-champion {
      position: absolute;
      top: 29%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      white-space: nowrap;
    }

    .annual-champion .name {
      display: block;
      margin-bottom: -2px;

      color: #1d83bb;
      font-size: clamp(17px, 5.2vw, 23px);
      font-weight: 800;
    }

    .annual-champion .score {
      color: #1778af;
      font-size: clamp(25px, 8vw, 36px);
      font-weight: 900;
      line-height: 1;
    }

    .annual-champion .unit {
      margin-left: 2px;
      color: #2e7ea7;
      font-size: 13px;
      font-weight: 700;
    }

    .annual-ranking {
      position: absolute;
      left: 4%;
      right: 4%;
      bottom: 8%;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4%;
    }

    .annual-person {
      text-align: center;
      white-space: nowrap;
    }

    .annual-person .name {
      display: block;
      color: #27546d;
      font-size: clamp(11px, 3.2vw, 14px);
      font-weight: 700;
    }

    .annual-person .score {
      color: #1c79a9;
      font-size: clamp(14px, 4vw, 18px);
      font-weight: 900;
    }

    .annual-person .unit {
      color: #4b7b92;
      font-size: 10px;
      font-weight: 700;
    }

    /* =========================
       MONTHLY MVP
    ========================= */

    .monthly-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .monthly-data {
      position: absolute;
      left: 16%;
      top: 46%;
      transform: translateY(-50%);
      text-align: center;
      white-space: nowrap;
    }

    .monthly-data .name {
      display: block;
      color: #247fb2;
      font-size: clamp(15px, 4.8vw, 21px);
      font-weight: 800;
    }

    .monthly-data .score {
      color: #197db4;
      font-size: clamp(22px, 7vw, 31px);
      font-weight: 900;
      line-height: 1.05;
    }

    .monthly-data .unit {
      margin-left: 2px;
      color: #4086a9;
      font-size: 12px;
      font-weight: 700;
    }

    /* =========================
       TAKO
    ========================= */

    .tako-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .tako-ranking {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 13%;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5%;
    }

    .tako-person {
      text-align: center;
      white-space: nowrap;
    }

    .tako-person .name {
      display: block;
      color: #a8565b;
      font-size: clamp(11px, 3.2vw, 14px);
      font-weight: 700;
    }

    .tako-person .score {
      color: #e76f73;
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 900;
    }

    .tako-person .unit {
      color: #c2696c;
      font-size: 10px;
      font-weight: 700;
    }

    /* =========================
       RECENT
    ========================= */

    .recent {
      margin-top: 15px;
      padding: 15px 14px 13px;

      background: rgba(255,255,255,.94);
      border: 1px solid #e2f1f7;
      border-radius: 22px;

      box-shadow:
        0 5px 16px rgba(56, 115, 145, .08);
    }

    .recent-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .recent-title {
      color: #296d91;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .recent-sub {
      color: #9aafba;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .10em;
    }

    .catch-row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 9px;

      min-height: 54px;
      padding: 7px 3px;

      border-bottom: 1px solid #edf4f7;
    }

    .catch-row:last-child {
      border-bottom: none;
    }

    .catch-icon {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .catch-main {
      min-width: 0;
    }

    .catch-top {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .catch-name {
      color: #31566a;
      font-size: 13px;
      font-weight: 800;
    }

    .catch-type {
      color: #7d9eae;
      font-size: 10px;
      font-weight: 600;
    }

    .catch-date {
      margin-top: 2px;
      color: #a4b5bd;
      font-size: 9px;
    }

    .catch-score {
      color: #2285b9;
      font-size: 18px;
      font-weight: 900;
      white-space: nowrap;
    }

    .catch-score small {
      margin-left: 1px;
      font-size: 10px;
      font-weight: 700;
    }

    /* =========================
       REGISTER BUTTON
    ========================= */

    .register-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      width: 88%;
      height: 51px;
      margin: 16px auto 2px;

      border: none;
      border-radius: 999px;

      background:
        linear-gradient(135deg, #35b6e5, #168bd0);

      color: white;
      font-size: 15px;
      font-weight: 800;

      box-shadow:
        0 7px 16px rgba(32, 146, 201, .25);

      cursor: pointer;
    }

    .register-button:active {
      transform: scale(.985);
    }

    .register-plus {
      display: grid;
      place-items: center;

      width: 22px;
      height: 22px;

      border: 1.5px solid rgba(255,255,255,.9);
      border-radius: 50%;

      font-size: 17px;
      line-height: 1;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 20;

      transform: translateX(-50%);

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      width: 100%;
      max-width: 430px;
      height: 76px;

      background: rgba(255,255,255,.97);
      border-top: 1px solid #e6eef2;

      box-shadow:
        0 -5px 18px rgba(53, 90, 109, .06);
    }

    .nav-item {
      border: none;
      background: transparent;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;

      color: #7e98a6;
      font-size: 9px;
      font-weight: 700;

      cursor: pointer;
    }

    .nav-item.active {
      color: #20a8df;
    }

    .nav-icon {
      position: relative;
      width: 25px;
      height: 25px;
    }

    /* home */

    .home-icon::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 9px;

      width: 14px;
      height: 12px;

      border: 2px solid currentColor;
      border-top: none;
      border-radius: 2px;
    }

    .home-icon::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 4px;

      width: 13px;
      height: 13px;

      border-left: 2px solid currentColor;
      border-top: 2px solid currentColor;

      transform: rotate(45deg);
      border-radius: 2px;
    }

    /* plus circle */

    .plus-icon {
      border: 2px solid currentColor;
      border-radius: 50%;
    }

    .plus-icon::before,
    .plus-icon::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;

      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .plus-icon::before {
      width: 10px;
      height: 2px;
    }

    .plus-icon::after {
      width: 2px;
      height: 10px;
    }

    /* history */

    .history-icon {
      border: 2px solid currentColor;
      border-radius: 4px;
    }

    .history-icon::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 6px;

      width: 11px;
      height: 2px;

      background: currentColor;
      box-shadow:
        0 5px 0 currentColor,
        0 10px 0 currentColor;
    }

    /* chart */

    .chart-icon {
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
    }

    .chart-icon::before {
      content: "";
      position: absolute;
      left: 5px;
      bottom: 2px;

      width: 4px;
      height: 9px;

      background: currentColor;

      box-shadow:
        6px -5px 0 currentColor,
        12px -10px 0 currentColor;
    }

    @media (min-width: 431px) {
      body {
        padding: 20px 0;
      }

      .app {
        border-radius: 28px;
        overflow: hidden;
        min-height: calc(100vh - 40px);
      }

      .bottom-nav {
        bottom: 20px;
        border-radius: 0 0 28px 28px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="hero">
    <img
      src="images/header.png"
      alt="IKA BATTLE"
    >
    <div class="season" id="seasonLabel"></div>
  </header>

  <main>

    <!-- 年間王者 -->
    <section class="image-card">
      <img
        src="images/card-annual.png"
        alt="年間王者"
      >

      <div class="annual-overlay">

        <div class="annual-champion">
          <span class="name">ひろき</span>
          <span class="score">42</span>
          <span class="unit">杯</span>
        </div>

        <div class="annual-ranking">

          <div class="annual-person">
            <span class="name">ひろき</span>
            <span class="score">42</span>
            <span class="unit">杯</span>
          </div>

          <div class="annual-person">
            <span class="name">ゆうま</span>
            <span class="score">37</span>
            <span class="unit">杯</span>
          </div>

          <div class="annual-person">
            <span class="name">まさき</span>
            <span class="score">31</span>
            <span class="unit">杯</span>
          </div>

        </div>

      </div>
    </section>

    <!-- 月間MVP -->
    <section class="image-card section-space">
      <img
        src="images/card-monthly.png"
        alt="今月のMVP"
      >

      <div class="monthly-overlay">
        <div class="monthly-data">
          <span class="name">まさき</span>
          <span class="score">18</span>
          <span class="unit">杯</span>
        </div>
      </div>
    </section>

    <!-- タコ部門 -->
    <section class="image-card section-space">
      <img
        src="images/card-tako.png"
        alt="タコ部門"
      >

      <div class="tako-overlay">
        <div class="tako-ranking">

          <div class="tako-person">
            <span class="name">ひろき</span>
            <span class="score">2</span>
            <span class="unit">匹</span>
          </div>

          <div class="tako-person">
            <span class="name">ゆうま</span>
            <span class="score">0</span>
            <span class="unit">匹</span>
          </div>

          <div class="tako-person">
            <span class="name">まさき</span>
            <span class="score">1</span>
            <span class="unit">匹</span>
          </div>

        </div>
      </div>
    </section>

    <!-- 最近の釣果 -->
    <section class="recent">

      <div class="recent-head">
        <div class="recent-title">最近の釣果</div>
        <div class="recent-sub">RECENT CATCH</div>
      </div>

      <div class="catch-row">

        <img
          class="catch-icon"
          src="images/aori-icon.png"
          alt=""
        >

        <div class="catch-main">
          <div class="catch-top">
            <span class="catch-name">ひろき</span>
            <span class="catch-type">アオリイカ</span>
          </div>
          <div class="catch-date">9月21日</div>
        </div>

        <div class="catch-score">
          3<small>杯</small>
        </div>

      </div>

      <div class="catch-row">

        <img
          class="catch-icon"
          src="images/kouika-icon.png"
          alt=""
        >

        <div class="catch-main">
          <div class="catch-top">
            <span class="catch-name">まさき</span>
            <span class="catch-type">コウイカ</span>
          </div>
          <div class="catch-date">9月20日</div>
        </div>

        <div class="catch-score">
          2<small>杯</small>
        </div>

      </div>

      <div class="catch-row">

        <img
          class="catch-icon"
          src="images/tako-icon.png"
          alt=""
        >

        <div class="catch-main">
          <div class="catch-top">
            <span class="catch-name">ひろき</span>
            <span class="catch-type">タコ</span>
          </div>
          <div class="catch-date">9月18日</div>
        </div>

        <div class="catch-score">
          1<small>匹</small>
        </div>

      </div>

    </section>

    <!-- 登録 -->
    <button
      class="register-button"
      type="button"
      onclick="alert('次に釣果登録画面をつなぎます！')"
    >
      <span class="register-plus">＋</span>
      釣果を登録する
    </button>

  </main>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="nav-item active">
    <span class="nav-icon home-icon"></span>
    <span>ホーム</span>
  </button>

  <button class="nav-item">
    <span class="nav-icon plus-icon"></span>
    <span>釣果登録</span>
  </button>

  <button class="nav-item">
    <span class="nav-icon history-icon"></span>
    <span>履歴</span>
  </button>

  <button class="nav-item">
    <span class="nav-icon chart-icon"></span>
    <span>データ</span>
  </button>

</nav>

<script>
  // 年は自動表示
  const currentYear = new Date().getFullYear();
  document.getElementById("seasonLabel").textContent =
    currentYear + " SEASON";
</script>

</body>
</html>
