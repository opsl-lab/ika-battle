<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eefaff">

<title>IKA BATTLE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    Meiryo,
    sans-serif;

  background:#eaf8fd;
  color:#173f58;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:0 auto;

  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #f4fbfe 45%,
      #dff5fc 78%,
      #aee5f5 100%
    );

  padding-bottom:82px;
  overflow:hidden;
}


/* =====================
   HEADER
===================== */

.hero{
  position:relative;
  width:100%;
}

.hero img{
  display:block;
  width:100%;
  height:auto;
}

/* 年だけHTMLで表示 */

.season-text{
  position:absolute;

  left:50%;
  top:57%;

  transform:translateX(-50%);

  color:#fff;

  font-size:clamp(10px,3.2vw,14px);
  font-weight:700;

  letter-spacing:.26em;

  white-space:nowrap;

  text-shadow:
    0 1px 4px rgba(0,78,120,.30);
}


/* =====================
   MAIN
===================== */

main{
  padding:8px 15px 25px;
}


/* =====================
   CARD COMMON
===================== */

.card-image{
  display:block;
  width:100%;
  height:auto;
}

.card{
  overflow:hidden;
  border-radius:20px;

  box-shadow:
    0 5px 15px rgba(42,109,143,.10);
}


/* =====================
   ANNUAL
===================== */

.annual-card{
  width:100%;
}


/*
今回はカード画像にサンプル文字が
入っているため、
HTML文字の二重表示はしない。

次工程で可変データ化する。
*/


/* =====================
   MVP + TAKO
===================== */

.mini-grid{
  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  gap:8px;

  margin-top:8px;

  align-items:start;
}

.mini-card{
  width:100%;
  border-radius:18px;
}


/* =====================
   RECENT
===================== */

.recent{
  margin-top:10px;

  padding:13px 14px 10px;

  background:
    rgba(255,255,255,.95);

  border-radius:20px;

  box-shadow:
    0 5px 15px rgba(45,109,140,.09);
}

.recent-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding-bottom:8px;

  border-bottom:
    1px solid #e3eef3;
}

.recent-title-wrap{
  display:flex;
  align-items:center;
  gap:8px;
}

.recent-title-icon{
  display:grid;
  place-items:center;

  width:29px;
  height:29px;

  border-radius:50%;

  background:#e5f6fc;
}

.recent-title-icon img{
  width:22px;
  height:22px;
  object-fit:contain;
}

.recent-title{
  color:#247ca8;

  font-size:13px;
  font-weight:900;

  letter-spacing:.13em;
}

.recent-title-jp{
  margin-top:1px;

  color:#3084aa;

  font-size:9px;
  font-weight:700;
}

.view-all{
  border:none;

  padding:7px 12px;

  border-radius:999px;

  background:#e9f7fc;

  color:#36728f;

  font-size:9px;
  font-weight:800;

  cursor:pointer;
}


/* rows */

.catch-row{
  display:grid;

  grid-template-columns:
    48px
    70px
    35px
    1fr
    auto;

  align-items:center;

  min-height:47px;

  border-bottom:
    1px solid #e8eff2;

  column-gap:5px;
}

.catch-row:last-child{
  border-bottom:none;
}

.catch-date{
  color:#36586b;

  font-size:11px;
}

.catch-name{
  color:#173f58;

  font-size:12px;
  font-weight:800;
}

.catch-icon{
  width:29px;
  height:29px;

  object-fit:contain;

  justify-self:center;
}

.catch-type{
  color:#294f64;

  font-size:11px;
}

.catch-score{
  color:#1486c6;

  font-size:17px;
  font-weight:900;

  white-space:nowrap;
}

.catch-score small{
  font-size:9px;
}


/* =====================
   REGISTER AREA
===================== */

.register-area{
  position:relative;

  margin-top:12px;

  min-height:88px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.register-note{
  position:absolute;

  left:1px;
  bottom:4px;

  color:rgba(255,255,255,.96);

  font-size:10px;

  line-height:1.55;

  transform:rotate(-5deg);

  text-shadow:
    0 1px 4px rgba(29,111,150,.30);
}

.register-button{
  position:relative;
  z-index:2;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;

  width:68%;
  min-height:51px;

  border:2px solid rgba(255,255,255,.88);

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #19c0e4,
      #047ac7
    );

  color:#fff;

  font-size:15px;
  font-weight:900;

  box-shadow:
    0 6px 15px rgba(12,121,180,.25);

  cursor:pointer;
}

.register-plus{
  display:grid;
  place-items:center;

  width:29px;
  height:29px;

  border-radius:50%;

  background:#fff;

  color:#148bc9;

  font-size:25px;
  font-weight:500;

  line-height:1;
}

.register-arrow{
  position:absolute;

  right:14px;

  font-size:25px;
  font-weight:300;
}


/* fish decoration */

.fish-decoration{
  position:absolute;

  right:0;
  bottom:0;

  width:62px;
  height:50px;

  opacity:.38;
}

.fish{
  position:absolute;

  width:24px;
  height:9px;

  border-radius:
    70% 35% 35% 70%;

  background:#147eb0;

  transform:rotate(-24deg);
}

.fish::after{
  content:"";

  position:absolute;

  right:-7px;
  top:1px;

  width:0;
  height:0;

  border-top:4px solid transparent;
  border-bottom:4px solid transparent;
  border-left:8px solid #147eb0;
}

.fish.one{
  right:5px;
  top:3px;

  transform:
    rotate(-27deg)
    scale(1.15);
}

.fish.two{
  right:30px;
  top:25px;

  transform:
    rotate(-22deg)
    scale(.78);
}

.fish.three{
  right:5px;
  top:36px;

  transform:
    rotate(-18deg)
    scale(.65);
}


/* =====================
   BOTTOM NAV
===================== */

.bottom-nav{
  position:fixed;

  left:50%;
  bottom:0;

  transform:translateX(-50%);

  z-index:100;

  width:100%;
  max-width:430px;
  height:74px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  background:
    rgba(255,255,255,.98);

  border-top:
    1px solid #e1edf2;

  box-shadow:
    0 -4px 14px
    rgba(47,97,121,.06);
}

.nav-item{
  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:3px;

  border:none;

  background:transparent;

  color:#7895a5;

  font-size:9px;
  font-weight:800;

  cursor:pointer;
}

.nav-item.active{
  color:#0ca5e0;
}

.nav-icon{
  position:relative;

  width:24px;
  height:24px;
}


/* HOME */

.home-icon::before{
  content:"";

  position:absolute;

  left:5px;
  top:9px;

  width:14px;
  height:12px;

  border:
    2px solid currentColor;

  border-top:none;

  border-radius:2px;
}

.home-icon::after{
  content:"";

  position:absolute;

  left:5px;
  top:4px;

  width:13px;
  height:13px;

  border-left:
    2px solid currentColor;

  border-top:
    2px solid currentColor;

  transform:rotate(45deg);
}


/* PLUS */

.plus-icon{
  border:
    2px solid currentColor;

  border-radius:50%;
}

.plus-icon::before,
.plus-icon::after{
  content:"";

  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  background:
    currentColor;
}

.plus-icon::before{
  width:10px;
  height:2px;
}

.plus-icon::after{
  width:2px;
  height:10px;
}


/* HISTORY */

.history-icon::before{
  content:"";

  position:absolute;

  left:3px;
  top:4px;

  width:4px;
  height:4px;

  border-radius:50%;

  background:currentColor;

  box-shadow:
    0 7px 0 currentColor,
    0 14px 0 currentColor;
}

.history-icon::after{
  content:"";

  position:absolute;

  left:10px;
  top:5px;

  width:12px;
  height:2px;

  background:currentColor;

  box-shadow:
    0 7px 0 currentColor,
    0 14px 0 currentColor;
}


/* DATA */

.data-icon{
  border-bottom:
    2px solid currentColor;
}

.data-icon::before{
  content:"";

  position:absolute;

  left:4px;
  bottom:2px;

  width:4px;
  height:9px;

  background:currentColor;

  box-shadow:
    7px -6px 0 currentColor,
    14px -12px 0 currentColor;
}


/* =====================
   DESKTOP
===================== */

@media(min-width:431px){

  body{
    padding:10px 0;
  }

  .app{
    min-height:
      calc(100vh - 20px);
  }

  .bottom-nav{
    bottom:10px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="hero">

    <img
      src="images/header.png"
      alt="IKA BATTLE"
    >

    <div
      class="season-text"
      id="seasonText">
    </div>

  </header>


  <main>


    <!-- =====================
         ANNUAL
    ====================== -->

    <section
      class="card annual-card">

      <img
        class="card-image"
        src="images/card-annual.png"
        alt="年間王者"
      >

    </section>


    <!-- =====================
         MVP + TAKO
    ====================== -->

    <div class="mini-grid">


      <section
        class="card mini-card">

        <img
          class="card-image"
          src="images/card-monthly.png"
          alt="今月のMVP"
        >

      </section>


      <section
        class="card mini-card">

        <img
          class="card-image"
          src="images/card-tako.png"
          alt="タコ部門"
        >

      </section>


    </div>


    <!-- =====================
         RECENT
    ====================== -->

    <section class="recent">

      <div class="recent-header">

        <div class="recent-title-wrap">

          <div class="recent-title-icon">

            <img
              src="images/aori-icon.png"
              alt=""
            >

          </div>

          <div>

            <div class="recent-title">
              RECENT CATCHES
            </div>

            <div class="recent-title-jp">
              最近の釣果
            </div>

          </div>

        </div>


        <button
          class="view-all"
          type="button">

          すべて見る 〉

        </button>

      </div>


      <!-- 1 -->

      <div class="catch-row">

        <div class="catch-date">
          9/21
        </div>

        <div class="catch-name">
          ひろき
        </div>

        <img
          class="catch-icon"
          src="images/aori-icon.png"
          alt=""
        >

        <div class="catch-type">
          アオリイカ
        </div>

        <div class="catch-score">
          5<small>杯</small>
        </div>

      </div>


      <!-- 2 -->

      <div class="catch-row">

        <div class="catch-date">
          9/20
        </div>

        <div class="catch-name">
          まさき
        </div>

        <img
          class="catch-icon"
          src="images/kouika-icon.png"
          alt=""
        >

        <div class="catch-type">
          コウイカ
        </div>

        <div class="catch-score">
          3<small>杯</small>
        </div>

      </div>


      <!-- 3 -->

      <div class="catch-row">

        <div class="catch-date">
          9/18
        </div>

        <div class="catch-name">
          ゆうま
        </div>

        <img
          class="catch-icon"
          src="images/aori-icon.png"
          alt=""
        >

        <div class="catch-type">
          アオリイカ
        </div>

        <div class="catch-score">
          4<small>杯</small>
        </div>

      </div>


    </section>


    <!-- =====================
         REGISTER
    ====================== -->

    <section class="register-area">


      <div class="register-note">

        釣ったイカが<br>
        思い出になる。

      </div>


      <button
        class="register-button"
        type="button">

        <span class="register-plus">
          ＋
        </span>

        <span>
          釣果を登録する
        </span>

        <span class="register-arrow">
          〉
        </span>

      </button>


      <div class="fish-decoration">

        <span class="fish one"></span>
        <span class="fish two"></span>
        <span class="fish three"></span>

      </div>


    </section>


  </main>

</div>


<!-- =====================
     BOTTOM NAV
===================== -->

<nav class="bottom-nav">


  <button
    class="nav-item active"
    type="button">

    <span
      class="nav-icon home-icon">
    </span>

    <span>
      ホーム
    </span>

  </button>


  <button
    class="nav-item"
    type="button">

    <span
      class="nav-icon plus-icon">
    </span>

    <span>
      釣果登録
    </span>

  </button>


  <button
    class="nav-item"
    type="button">

    <span
      class="nav-icon history-icon">
    </span>

    <span>
      履歴
    </span>

  </button>


  <button
    class="nav-item"
    type="button">

    <span
      class="nav-icon data-icon">
    </span>

    <span>
      データ
    </span>

  </button>


</nav>


<script>

/* 毎年自動で年を変更 */

const year =
  new Date().getFullYear();

document
  .getElementById("seasonText")
  .textContent =
  year + " SEASON";

</script>


</body>
</html>
